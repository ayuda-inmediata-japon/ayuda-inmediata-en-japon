    <section class="turismo-hero">
      <h1>🌸 Turismo en Japón: qué ver, rutas y lugares turísticos</h1>

      <p>
  Guía práctica de turismo en Japón con lugares turísticos, rutas e itinerarios
  para Tokio, Kioto, Osaka, Monte Fuji y otras ciudades, además de consejos,
  atracciones y enlaces útiles para organizar tu viaje.
</p>
      

      <img
        src="Img/turismojapon.webp"
        class="hero-img"
        alt="Turismo en Japón"
      >
    </section>

    <div class="accordion-list">

      <details class="accordion-card">
        <summary>🌸 ¿Qué es el turismo en Japón?</summary>
        <div class="accordion-content">
          <p>
            El turismo en Japón no es solo visitar lugares bonitos. También significa
            conocer su cultura, respetar sus costumbres y disfrutar cada lugar con
            educación, seguridad y consideración hacia las personas que viven aquí.
          </p>
        </div>
      </details>

      <details class="accordion-card">
        <summary>✅ Qué hacer durante tu viaje</summary>
        <div class="accordion-content">
          <ul>
            <li>Respeta las filas en estaciones, tiendas, templos y atracciones.</li>
            <li>Habla en voz baja en trenes y lugares públicos.</li>
            <li>Lleva tu basura contigo si no encuentras basurero.</li>
            <li>Revisa el clima y el horario del último tren antes de salir.</li>
            <li>Guarda la dirección de tu hotel en japonés.</li>
            <li>Lleva efectivo, batería portátil y el teléfono cargado.</li>
          </ul>
        </div>
      </details>

      <details class="accordion-card">
        <summary>❌ Qué no hacer</summary>
        <div class="accordion-content">
          <ul>
            <li>No hables fuerte dentro del tren.</li>
            <li>No fumes fuera de las zonas permitidas.</li>
            <li>No tires basura en la calle.</li>
            <li>No bloquees escaleras, entradas o pasillos.</li>
            <li>No tomes fotos a personas sin permiso.</li>
            <li>No toques objetos de templos o santuarios sin autorización.</li>
          </ul>
        </div>
      </details>

      <details class="accordion-card">
        <summary>⛩️ Respeto en templos y santuarios</summary>
        <div class="accordion-content">
          <p>
            Los templos y santuarios son lugares turísticos, pero también son espacios
            de respeto espiritual y cultural. Muchas personas van allí a orar o a
            participar en tradiciones. Camina con calma, evita gritar, respeta las
            señales y no entres en zonas prohibidas.
          </p>
        </div>
      </details>

      <details class="accordion-card">
        <summary>🗣️ Palabras útiles para turistas</summary>
        <div class="accordion-content">
          <div class="phrase-box">
            <p><strong>Gracias</strong><br>ありがとうございます<br><small>Arigatō gozaimasu</small></p>
            <p><strong>Disculpe</strong><br>すみません<br><small>Sumimasen</small></p>
            <p><strong>¿Dónde está la estación?</strong><br>駅はどこですか？<br><small>Eki wa doko desu ka?</small></p>
            <p><strong>¿Cuánto cuesta?</strong><br>いくらですか？<br><small>Ikura desu ka?</small></p>
            <p><strong>No entiendo japonés</strong><br>日本語がわかりません<br><small>Nihongo ga wakarimasen</small></p>
            <p><strong>Ayuda, por favor</strong><br>助けてください<br><small>Tasukete kudasai</small></p>
          </div>
        </div>
      </details>

      <details class="accordion-card">
        <summary>📱 Aplicaciones útiles</summary>
        <div class="accordion-content">
          <ul class="apps-list">
            <li>🗺️ <strong>Google Maps:</strong> rutas, lugares y transporte.</li>
            <li>🚆 <strong>NAVITIME Japan Travel:</strong> trenes, horarios y transbordos.</li>
            <li>🌐 <strong>Google Translate:</strong> traducción rápida y cámara.</li>
            <li>🔤 <strong>DeepL:</strong> traducciones más naturales.</li>
            <li>🚨 <strong>Safety Tips:</strong> terremotos, tifones y emergencias.</li>
            <li>🇯🇵 <strong>Japan Official Travel App:</strong> turismo oficial de Japón.</li>
          </ul>
        </div>
      </details>

      <details class="accordion-card">
        <summary>🌸 Lugares turísticos recomendados en Japón</summary>
        <div class="accordion-content">

          <p>
            Explora algunos de los destinos más populares de Japón.
            Abre cada lugar para ver un video y conocer mejor su ambiente.
          </p>

          <div class="lugares-box">

            <details class="lugar-card">
              <summary>🌆 Tokio – Modernidad y energía</summary>
              <div class="lugar-content">
                <p>
                  Tokio combina rascacielos, trenes, luces, tecnología, compras y
                  barrios famosos como Shibuya, Shinjuku y Asakusa.
                </p>

                <div class="video-box">
                  <iframe
                    src="https://www.youtube.com/embed/BDt4EQ99lhQ"
                    title="Tokio turismo"
                    loading="lazy"
                    allowfullscreen
                  ></iframe>
                </div>
              </div>
            </details>

            <details class="lugar-card">
              <summary>⛩️ Kioto – Tradición y templos</summary>
              <div class="lugar-content">
                <p>
                  Kioto es ideal para ver templos, santuarios, calles antiguas,
                  jardines japoneses y paisajes tradicionales.
                </p>

                <div class="video-box">
                  <iframe
                    src="https://www.youtube.com/embed/6lt2JfJdGSY"
                    title="Kioto turismo"
                    loading="lazy"
                    allowfullscreen
                  ></iframe>
                </div>
              </div>
            </details>

            <details class="lugar-card">
              <summary>🍜 Osaka – Comida y diversión</summary>
              <div class="lugar-content">
                <p>
                  Osaka es famosa por su comida callejera, Dotonbori, ambiente alegre
                  y buena conexión con Kioto, Nara y Kobe.
                </p>

                <div class="video-box">
                  <iframe
                    src="https://www.youtube.com/embed/J1c0hrrYhhc"
                    title="Osaka turismo"
                    loading="lazy"
                    allowfullscreen
                  ></iframe>
                </div>
              </div>
            </details>

            <details class="lugar-card">
              <summary>🗻 Monte Fuji – Naturaleza icónica</summary>
              <div class="lugar-content">
                <p>
                  El Monte Fuji es uno de los símbolos más importantes de Japón.
                  Es ideal para fotos, excursiones y paisajes naturales.
                </p>

                <div class="video-box">
                  <iframe
                    src="https://www.youtube.com/embed/8lRA_bA8ySg?si=GebsIMxequsSuZhK"
                    title="Monte Fuji turismo"
                    loading="lazy"
                    allowfullscreen
                  ></iframe>
                </div>
              </div>
            </details>

          </div>
        </div>
      </details>

      <!-- NUEVA SECCIÓN AGREGADA -->
      <details class="accordion-card">
        <summary>🗾 Rutas turísticas por Japón</summary>
        <div class="accordion-content">

          <div class="route-map">
            Ruta recomendada para conocer Japón por primera vez:<br>
            Tokio → Fuji o Hakone → Nagoya con Ghibli Park o LEGOLAND → Kioto → Nara → Osaka y Universal Studios → Hiroshima y Miyajima
          </div>

          <div class="routes-box">

            <details class="route-card">
              <summary>3 días — Tokio esencial / 東京3日間</summary>
              <div class="route-content">
                <div class="route-day"><strong>Día 1:</strong> Asakusa, Sensō-ji, Nakamise y Tokyo Skytree.</div>
                <div class="route-day"><strong>Día 2:</strong> Shibuya, Harajuku, Meiji Jingū y Shinjuku.</div>
                <div class="route-day"><strong>Día 3:</strong> Disneyland, DisneySea, teamLab o Museo Ghibli. Elige solo una experiencia.</div>
              </div>
            </details>

            <details class="route-card">
              <summary>5 días — Tokio + Disney o Fuji / 東京・富士5日間</summary>
              <div class="route-content">
                <div class="route-day"><strong>Días 1 al 3:</strong> Tokio esencial.</div>
                <div class="route-day"><strong>Día 4:</strong> Tokyo Disneyland, DisneySea o Museo Ghibli.</div>
                <div class="route-day"><strong>Día 5:</strong> Excursión a Kawaguchiko o Hakone.</div>
              </div>
            </details>

            <details class="route-card">
              <summary>7 días — Tokio, Kioto y Osaka / 日本7日間</summary>
              <div class="route-content">
                <div class="route-day"><strong>Días 1 al 3:</strong> Tokio.</div>
                <div class="route-day"><strong>Día 4:</strong> Shinkansen a Kioto, Fushimi Inari y Gion.</div>
                <div class="route-day"><strong>Día 5:</strong> Kiyomizu-dera, Higashiyama y Arashiyama o Kinkaku-ji.</div>
                <div class="route-day"><strong>Día 6:</strong> Nara y Tōdai-ji.</div>
                <div class="route-day"><strong>Día 7:</strong> Osaka, castillo, Dōtonbori y Umeda.</div>
              </div>
            </details>

            <details class="route-card">
              <summary>7 días — Osaka, LEGOLAND y Tokio / 家族旅行7日間</summary>
              <div class="route-content">
                <div class="route-day"><strong>Días 1 y 2:</strong> Osaka: castillo, Dōtonbori, acuario o actividades familiares.</div>
                <div class="route-day"><strong>Día 3:</strong> Traslado a Nagoya y paseo por la ciudad.</div>
                <div class="route-day"><strong>Día 4:</strong> LEGOLAND Japan. Puede combinarse con SEA LIFE Nagoya si el horario y la energía de los niños lo permiten.</div>
                <div class="route-day"><strong>Día 5:</strong> Nagoya y traslado a Tokio.</div>
                <div class="route-day"><strong>Días 6 y 7:</strong> Tokio: Asakusa, Shibuya, Skytree o una actividad familiar.</div>
                <div class="warning-box"><strong>Ideal para:</strong> familias con niños que llegan por Osaka y regresan desde Tokio, evitando volver al punto de partida.</div>
              </div>
            </details>

            <details class="route-card">
              <summary>1 día — LEGOLAND Japan en familia / レゴランド1日</summary>
              <div class="route-content">
                <div class="route-day"><strong>Mañana:</strong> Llegada a Kinjō-futō y entrada a LEGOLAND Japan.</div>
                <div class="route-day"><strong>Mediodía:</strong> Almuerzo dentro del parque y atracciones adaptadas a la edad y estatura de los niños.</div>
                <div class="route-day"><strong>Tarde:</strong> Continuar en LEGOLAND o visitar SEA LIFE Nagoya, situado frente al parque.</div>
                <div class="route-day"><strong>Noche:</strong> Regreso al hotel en Nagoya.</div>
                <div class="warning-box"><strong>Tiempo orientativo:</strong> día completo. Compra las entradas con anticipación y revisa horarios, días de cierre y restricciones de estatura.</div>
                <div class="link-row">
                  <a class="mini-btn official" href="https://www.legoland.jp/en/" target="_blank" rel="noopener">Sitio oficial</a>
                  <a class="mini-btn" href="https://www.google.com/maps/search/?api=1&query=LEGOLAND+Japan+Resort" target="_blank" rel="noopener">Google Maps</a>
                </div>
              </div>
            </details>

            <details class="route-card">
              <summary>10 días — Tokio, Fuji, Kioto, Nara y Osaka / 日本10日間</summary>
              <div class="route-content">
                <div class="route-day"><strong>Días 1 al 3:</strong> Tokio.</div>
                <div class="route-day"><strong>Día 4:</strong> Fuji o Hakone.</div>
                <div class="route-day"><strong>Días 5 al 7:</strong> Kioto.</div>
                <div class="route-day"><strong>Día 8:</strong> Nara.</div>
                <div class="route-day"><strong>Día 9:</strong> Osaka.</div>
                <div class="route-day"><strong>Día 10:</strong> Universal Studios Japan.</div>
              </div>
            </details>

            <details class="route-card">
              <summary>14 días — Ruta completa / 日本周遊14日間</summary>
              <div class="route-content">
                <div class="route-day"><strong>Día 1:</strong> Llegada a Tokio y descanso.</div>
                <div class="route-day"><strong>Día 2:</strong> Asakusa, Sensō-ji y Skytree.</div>

      <details class="accordion-card">
        <summary>✈️ Rutas para entrar por una ciudad y salir por otra</summary>

        <div class="accordion-content">

          <p>
            Estas rutas están organizadas para comenzar en una ciudad y terminar
            en otra. Así el turista puede avanzar por Japón sin perder tiempo
            regresando nuevamente al punto de llegada.
          </p>

          <div class="warning-box">
            <strong>💡 Idea principal:</strong><br>
            Al comprar el pasaje, busca la opción de llegada y regreso desde
            aeropuertos diferentes. Por ejemplo:
            <br><br>
            ✈️ Llegada a Osaka — Kansai International Airport (KIX)<br>
            ✈️ Regreso desde Tokio — Haneda (HND) o Narita (NRT)
            <br><br>
            También puede hacerse en sentido contrario: llegar a Tokio y regresar
            desde Osaka.
          </div>

          <div class="routes-box">

                  <strong>Día 2 — Osaka en familia / 大阪</strong><br>

                <div class="route-day">

                  Parque de Nara, Tōdai-ji, Naramachi y traslado a Kioto.
                </div>

                <div class="route-day">
                  <strong>Día 4 — Kioto oriental / 京都東部</strong><br>
                  Fushimi Inari, Kiyomizu-dera, calles Ninenzaka y Sannenzaka
                  y paseo por Gion.
                </div>

                <div class="route-day">
                  <strong>Día 5 — Kioto occidental / 京都西部</strong><br>
                  Arashiyama, bosque de bambú, puente Togetsukyō y Kinkaku-ji.
                </div>

                <div class="route-day">
                  <strong>Día 6 — Traslado a Tokio / 東京へ移動</strong><br>
                  Viaje a Tokio. Por la tarde: Shibuya, Harajuku o Shinjuku.
                </div>

                <div class="route-day">
                  <strong>Día 7 — Tokio y regreso / 東京・帰国</strong><br>
                  Asakusa, Sensō-ji o compras, según el horario del vuelo.
                  Regreso desde Haneda o Narita.
                </div>

                <div class="warning-box">
                  <strong>Recomendada para:</strong> primera visita corta a Japón,
                  viajeros que desean conocer las tres ciudades principales sin
                  regresar a Osaka.
                </div>

              </div>
            </details>

            <details class="route-card">
              <summary>

                <div class="route-day"><strong>Día 3 — Kōyasan / 高野山</strong><br>Traslado desde Osaka. Visita Okunoin, Kongōbu-ji y alojamiento en un templo, si se desea vivir una experiencia tradicional.</div>
                <div class="route-day"><strong>Día 4 — Kōyasan → Kioto</strong><br>Regreso desde Kōyasan y traslado a Kioto. Paseo nocturno por Gion.</div>
                <div class="route-day"><strong>Día 5 — Kioto oriental</strong><br>Fushimi Inari, Kiyomizu-dera, Higashiyama y Yasaka.</div>

                <div class="route-day"><strong>Día 9 — Kanazawa → Tokio</strong><br>Traslado hacia Tokio. Paseo por Shibuya o Shinjuku.</div>

                  <strong>Recomendada para:</strong> viajeros interesados en

                </div>

              </div>
            </details>

            <!-- RUTA 3 -->
            <details class="route-card">
              <summary>
                10 días — Osaka → Hiroshima → Kurashiki → Kioto → Tokio
                <br>
                大阪・広島・倉敷・京都・東京 10日間
              </summary>

              <div class="route-content">
                <div class="route-day"><strong>Día 1 — Llegada a Osaka</strong><br>Llegada por Kansai Airport y descanso.</div>
                <div class="route-day"><strong>Día 2 — Osaka</strong><br>Castillo de Osaka, Dōtonbori y Umeda.</div>
                <div class="route-day"><strong>Día 3 — Hiroshima / 広島</strong><br>Traslado a Hiroshima. Parque Memorial de la Paz, museo y Cúpula de la Bomba Atómica.</div>
                <div class="route-day"><strong>Día 4 — Miyajima / 宮島</strong><br>Santuario Itsukushima, gran torii y paseo por la isla.</div>
                <div class="route-day"><strong>Día 5 — Kurashiki / 倉敷</strong><br>Traslado a Kurashiki. Barrio histórico Bikan, canales, antiguas casas comerciales y museos.</div>

                <div class="route-day"><strong>Día 7 — Kioto</strong><br>Fushimi Inari, Kiyomizu-dera y Gion.</div>
                <div class="route-day"><strong>Día 8 — Kioto → Tokio</strong><br>Arashiyama por la mañana y traslado a Tokio.</div>
                <div class="route-day"><strong>Día 9 — Tokio</strong><br>Asakusa, Shibuya, Harajuku y Shinjuku.</div>
                <div class="route-day"><strong>Día 10 — Tokio y regreso</strong><br>Compras o paseo según el horario del vuelo. Regreso desde Haneda o Narita.</div>

              </div>
            </details>

            <!-- RUTA 4 -->
            <details class="route-card">
              <summary>
                12 días — Osaka → Onomichi → Hiroshima → Kioto → Nikkō → Tokio

              </summary>

                <div class="route-day"><strong>Día 3 — Onomichi / 尾道</strong><br>Traslado a Onomichi. Camino de los templos, calles en pendiente, miradores y paseo junto al mar.</div>
                <div class="route-day"><strong>Día 4 — Onomichi y región de Setouchi</strong><br>Recorrido por una parte de Shimanami Kaidō en bicicleta, autobús o barco, según la condición física.</div>
                <div class="route-day"><strong>Día 5 — Hiroshima</strong><br>Parque Memorial de la Paz y museo.</div>
                <div class="route-day"><strong>Día 6 — Miyajima</strong><br>Santuario Itsukushima, torii y paseo por la isla.</div>
                <div class="route-day"><strong>Día 7 — Hiroshima → Kioto</strong><br>Traslado a Kioto. Paseo por Gion al atardecer.</div>
                <div class="route-day"><strong>Día 8 — Kioto oriental</strong><br>Fushimi Inari, Kiyomizu-dera, Higashiyama y Yasaka.</div>
                <div class="route-day"><strong>Día 9 — Kioto occidental</strong><br>Arashiyama, bosque de bambú y Kinkaku-ji.</div>
                <div class="route-day"><strong>Día 10 — Kioto → Tokio</strong><br>Traslado a Tokio. Shibuya o Shinjuku por la tarde.</div>
                <div class="route-day"><strong>Día 11 — Nikkō / 日光</strong><br>Excursión a Nikkō: santuario Tōshō-gū, puente Shinkyō y templos históricos. Para visitar lago Chūzenji y cascada Kegon es preferible disponer de más tiempo.</div>

                <div class="route-day"><strong>Día 2 — Osaka</strong><br>Castillo, Kuromon, Shinsekai y Dōtonbori.</div>
                <div class="route-day"><strong>Día 3 — Kōyasan</strong><br>Okunoin, Kongōbu-ji y alojamiento en templo.</div>
                <div class="route-day"><strong>Día 4 — Kōyasan → Kioto</strong><br>Regreso y traslado a Kioto.</div>
                <div class="route-day"><strong>Día 5 — Kioto oriental</strong><br>Fushimi Inari, Kiyomizu-dera e Higashiyama.</div>
                <div class="route-day"><strong>Día 6 — Kioto occidental</strong><br>Arashiyama y Kinkaku-ji.</div>
                <div class="route-day"><strong>Día 7 — Kioto → Takayama / 高山</strong><br>Traslado a Takayama y paseo por el casco histórico.</div>
                <div class="route-day"><strong>Día 8 — Takayama</strong><br>Mercado matinal, Sanmachi Suji, casas tradicionales y gastronomía de Hida.</div>
                <div class="route-day"><strong>Día 9 — Shirakawa-gō → Kanazawa</strong><br>Visita al pueblo histórico de Shirakawa-gō y continuación hacia Kanazawa.</div>
                <div class="route-day"><strong>Día 10 — Kanazawa</strong><br>Kenroku-en, castillo, Higashi Chaya y Nagamachi.</div>
                <div class="route-day"><strong>Día 11 — Kanazawa → Tokio</strong><br>Traslado a Tokio. Paseo por Shibuya o Shinjuku.</div>
                <div class="route-day"><strong>Día 12 — Tokio</strong><br>Asakusa, Sensō-ji, Skytree y Akihabara.</div>
                <div class="route-day"><strong>Día 13 — Nikkō</strong><br>Excursión a Nikkō: Tōshō-gū, Rinnō-ji, Futarasan y puente Shinkyō.</div>
                <div class="route-day"><strong>Día 14 — Tokio y regreso</strong><br>Compras finales y regreso desde Haneda o Narita.</div>
                <div class="warning-box"><strong>Recomendada para:</strong> quienes desean conocer ciudades tradicionales, pueblos de montaña y lugares distintos de la ruta turística más habitual.</div>
              </div>
            </details>

              <summary>

                <div class="route-day"><strong>Día 3 — Nikkō</strong><br>Excursión a Tōshō-gū, puente Shinkyō y templos.</div>

                <div class="route-day"><strong>Día 5 — Kanazawa</strong><br>Kenroku-en, castillo, mercado Ōmichō y Nagamachi.</div>

                <div class="route-day"><strong>Día 7 — Kioto oriental</strong><br>Fushimi Inari, Kiyomizu-dera e Higashiyama.</div>
                <div class="route-day"><strong>Día 8 — Kioto occidental</strong><br>Arashiyama, Kinkaku-ji y traslado a Osaka.</div>
                <div class="route-day"><strong>Día 9 — Osaka</strong><br>Castillo de Osaka, Kuromon, Dōtonbori y Umeda.</div>

              <li>Las rutas son orientativas y deben adaptarse a la edad, movilidad y temporada.</li>

  <script>
    document.addEventListener("click", (event) => {
      const summary = event.target.closest("summary");
      if (!summary) return;

      const current = summary.parentElement;

      if (current.classList.contains("accordion-card")) {
        document.querySelectorAll(".accordion-card").forEach((details) => {
          if (details !== current) {
            details.removeAttribute("open");
          }
        });
      }

      if (current.classList.contains("lugar-card")) {
        const container = current.closest(".lugares-box");
        if (!container) return;

        container.querySelectorAll(".lugar-card").forEach((details) => {
          if (details !== current) {
            details.removeAttribute("open");
          }
        });
      }

      if (current.classList.contains("route-card")) {
        const container = current.closest(".routes-box");
        if (!container) return;

        container.querySelectorAll(".route-card").forEach((details) => {
          if (details !== current) {
            details.removeAttribute("open");
          }
        });
      }

      if (current.classList.contains("category-card")) {
        const container = current.closest(".attraction-categories");
        if (!container) return;

        container.querySelectorAll(".category-card").forEach((details) => {
          if (details !== current) {
            details.removeAttribute("open");
          }
        });
      }
    });
  </script>
